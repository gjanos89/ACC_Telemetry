name: Fix telemetry stream alignment

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch reporter to use time-aligned telemetry
        shell: python
        run: |
          from pathlib import Path

          p = Path("src/bin/acr_session_report.rs")
          s = p.read_text(encoding="utf-8")

          old = '''    // Physics and Graphics do not share packet-id/time axes.  Align them by
    // the actual recorded distance, using the measured physics sample rate.
    // This avoids the long-session drift caused by assuming exactly 333/60 Hz.
    let physics_eff_hz = effective_physics_hz(&physics_records, &physics, physics_hz);
    let (gfx_to_phy_a, gfx_to_phy_b) = fit_gfx_to_physics_by_distance(
        &gfx, &physics_records, physics_eff_hz,
    );
    eprintln!(
        "Telemetry distance alignment: physics_eff_hz={:.3} Hz, gfx->physics index = {:.6} * gfx + {:.1}",
        physics_eff_hz, gfx_to_phy_a, gfx_to_phy_b
    );'''

          new = '''    // Physics and Graphics are separate streams. Their sample rates and
    // recording origins are not guaranteed to match, so do NOT align them
    // by integrating physics speed against Graphics distance. That method
    // accumulates timing error and can shift an entire lap's telemetry.
    // Instead align the streams on their recording time origins and use the
    // measured Graphics sample rate for the index conversion.
    let stream_offset = estimate_stream_offset(
        &physics_records,
        &gfx,
        gfx_hz,
        boundaries[0].1,
    );
    eprintln!(
        "Telemetry time alignment: graphics_time = physics_time {:+.6}s",
        stream_offset
    );'''
          if old not in s:
              raise SystemExit("alignment block not found")
          s = s.replace(old, new, 1)

          old = '''        let p_start = gfx_to_physics_index(lap.gfx_start, gfx_to_phy_a, gfx_to_phy_b, physics_records.len());
        let p_end = gfx_to_physics_index(lap.gfx_end, gfx_to_phy_a, gfx_to_phy_b, physics_records.len());
        let physics_start_time = physics_records[p_start].capture_time_sec;'''
          new = '''        let gfx_start_time = lap.gfx_start as f64 / gfx_hz.max(1) as f64;
        let gfx_end_time = lap.gfx_end as f64 / gfx_hz.max(1) as f64;
        let p_start = nearest_index_by_time(
            &physics_records,
            gfx_start_time - stream_offset,
        );
        let p_end = nearest_index_by_time(
            &physics_records,
            gfx_end_time - stream_offset,
        );
        let physics_start_time = physics_records[p_start].capture_time_sec;'''
          if old not in s:
              raise SystemExit("lap physics range block not found")
          s = s.replace(old, new, 1)

          old = '''    gfx_to_phy_a: f64,
    gfx_to_phy_b: f64,
) -> (Vec<serde_json::Value>, Vec<serde_json::Value>) {'''
          new = '''    gfx_hz: u32,
    stream_offset: f64,
) -> (Vec<serde_json::Value>, Vec<serde_json::Value>) {'''
          if old not in s:
              raise SystemExit("event_points signature not found")
          s = s.replace(old, new, 1)

          old = '''        let gi = physics_to_gfx_index(physics_index, gfx_to_phy_a, gfx_to_phy_b, gfx.len())
            .clamp(gfx_start, gfx_end);'''
          new = '''        let gfx_time = r.capture_time_sec + stream_offset;
        let gi = ((gfx_time * gfx_hz.max(1) as f64).round() as isize)
            .clamp(gfx_start as isize, gfx_end as isize) as usize;'''
          if old not in s:
              raise SystemExit("event graphics mapping not found")
          s = s.replace(old, new, 1)

          old = '''            gfx_to_phy_a,
            gfx_to_phy_b,
        );'''
          new = '''            gfx_hz,
            stream_offset,
        );'''
          if old not in s:
              raise SystemExit("event_points call arguments not found")
          s = s.replace(old, new, 1)

          old = '''            let gi = physics_to_gfx_index(pi, gfx_to_phy_a, gfx_to_phy_b, gfx.len())
                .clamp(lap.gfx_start, lap.gfx_end);'''
          new = '''            let gfx_time = r.capture_time_sec + stream_offset;
            let gi = ((gfx_time * gfx_hz.max(1) as f64).round() as isize)
                .clamp(lap.gfx_start as isize, lap.gfx_end as isize) as usize;'''
          if old not in s:
              raise SystemExit("telemetry graphics mapping not found")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
