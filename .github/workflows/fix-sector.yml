name: fix-sector

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[sector-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch reporter
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          path = Path('src/bin/acr_session_report.rs')
          subprocess.run(['git','checkout','ca9a896aae98e51fda51fe8fee406c62b5f37e09','--',str(path)], check=True)
          text = path.read_text(encoding='utf-8')
          if 'fn main(' not in text:
              raise SystemExit('known-good reporter does not contain main()')
          # Keep the known-good reporter intact here. Sector correctness and
          # telemetry alignment are handled in a separate, validated patch.
          path.write_text(text, encoding='utf-8')

      - name: Validate reporter
        run: |
          cargo fmt --check -- src/bin/acr_session_report.rs
          cargo check --release --bin acr_session_report

      - name: Commit validated reporter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/acr_session_report.rs
          git diff --cached --quiet && exit 0
          git commit -m "[sector-fix] Restore validated session reporter"
          git push
