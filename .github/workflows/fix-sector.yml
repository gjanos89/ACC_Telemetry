name: Fix sector extraction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[sector-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore known-good reporter and patch sectors
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = Path('src/bin/acr_session_report.rs')
          # ca9a896 is the known-good complete reporter: it contains
          # main() and uses PhysicsRecord.gas (not the obsolete throttle field).
          subprocess.run(['git', 'checkout', 'ca9a896aae98e51fda51fe8fee406c62b5f37e09', '--', str(path)], check=True)
          text = path.read_text(encoding='utf-8')

          # Replace only the sector extraction function. Keep the complete
          # known-good reporter, including main(), intact.
          start_marker = 'fn extract_lap_sectors('
          end_marker = '\nfn event_points('
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate extract_lap_sectors() boundaries')

          replacement = '''fn extract_lap_sectors(
              gfx: &[acr_recorder::record::GraphicsRecord],
              start: usize,
              end: usize,
              lap_time_sec: f64,
          ) -> Vec<Option<f64>> {
              let mut sectors = vec![None, None, None];
              if gfx.is_empty() || start >= gfx.len() || end <= start {
                  return sectors;
              }

              let end = end.min(gfx.len() - 1);
              let mut previous = gfx[start].current_sector_index;
              let mut cumulative_s1: Option<f64> = None;
              let mut cumulative_s2: Option<f64> = None;

              for i in (start + 1)..=end {
                  let current = gfx[i].current_sector_index;
                  if current != previous {
                      if let Some(t) = sector_time_sec(&gfx[i]) {
                          match previous {
                              0 => cumulative_s1 = Some(t),
                              1 => cumulative_s2 = Some(t),
                              _ => {}
                          }
                      }
                      previous = current;
                  }
              }

              // ACC's last_sector_time is cumulative elapsed lap time at the
              // sector boundary, not the duration of that sector.
              if let Some(s1) = cumulative_s1 {
                  sectors[0] = Some(s1);
              }

              if let (Some(s1), Some(s2)) = (cumulative_s1, cumulative_s2) {
                  sectors[1] = Some((s2 - s1).max(0.0));
                  // Use the authoritative completed-lap time already parsed
                  // from the Graphics lap boundary. Do not read
                  // gfx[end].last_time_str here.
                  sectors[2] = Some((lap_time_sec - s2).max(0.0));
              }

              sectors
          }

          text = text[:start] + replacement + text[end:]

          # Pass the authoritative Lap.time_sec into the extractor.
          old_call = 'extract_lap_sectors(&gfx, lap.gfx_start, lap.gfx_end)'
          new_call = 'extract_lap_sectors(&gfx, lap.gfx_start, lap.gfx_end, lap.time_sec)'
          if old_call not in text:
              raise SystemExit('Could not locate extract_lap_sectors() call site')
          text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding='utf-8', newline='\n')

          # Hard safety checks: the restored reporter must be complete and
          # must not contain the obsolete PhysicsRecord.throttle field.
          if 'fn main() -> Result<(), Box<dyn std::error::Error>>' not in text:
              raise SystemExit('Safety check failed: main() missing after patch')
          if 'r.throttle' in text or 'prev_gas = r.throttle' in text:
              raise SystemExit('Safety check failed: obsolete throttle field remains')

      - name: Validate Rust source
        run: cargo check --bin acr_session_report

      - name: Commit fixed reporter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/acr_session_report.rs .github/workflows/fix-sector.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restore reporter and fix S3 [sector-fix]"
          git push origin main
