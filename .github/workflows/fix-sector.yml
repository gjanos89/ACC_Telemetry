name: Fix sector extraction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[sector-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore known-good reporter and patch sectors
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          path = Path('src/bin/acr_session_report.rs')
          subprocess.run(['git', 'checkout', '96454d4', '--', str(path)], check=True)
          text = path.read_text(encoding='utf-8')

          replacement = r'''fn extract_lap_sectors(
              gfx: &[acr_recorder::record::GraphicsRecord],
              start: usize,
              end: usize,
              lap_time_sec: f64,
          ) -> Vec<Option<f64>> {
              let mut sectors = vec![None, None, None];
              if gfx.is_empty() || start >= gfx.len() || end <= start {
                  return sectors;
              }

              let end = end.min(gfx.len() - 1);
              let mut previous = gfx[start].current_sector_index;
              let mut cumulative_s1: Option<f64> = None;
              let mut cumulative_s2: Option<f64> = None;

              for i in (start + 1)..=end {
                  let current = gfx[i].current_sector_index;
                  if current != previous {
                      if let Some(t) = sector_time_sec(&gfx[i]) {
                          match previous {
                              0 => cumulative_s1 = Some(t),
                              1 => cumulative_s2 = Some(t),
                              _ => {}
                          }
                      }
                      previous = current;
                  }
              }

              // ACC's last_sector_time is cumulative elapsed lap time at the
              // sector boundary, not the duration of that sector.
              if let Some(s1) = cumulative_s1 {
                  sectors[0] = Some(s1);
              }

              if let (Some(s1), Some(s2)) = (cumulative_s1, cumulative_s2) {
                  sectors[1] = Some((s2 - s1).max(0.0));
                  // Use the authoritative completed-lap time already parsed
                  // from the Graphics lap boundary. Do NOT read gfx[end].last_time_str
                  // here: that field is not a reliable per-lap time reference.
                  sectors[2] = Some((lap_time_sec - s2).max(0.0));
              }

              sectors
          }

'''

          pattern = r'fn extract_lap_sectors\(.*?\n\}\n\nfn event_points\('
          new_text, count = re.subn(pattern, replacement + 'fn event_points(', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate extract_lap_sectors()')

          # Pass the already parsed authoritative lap time into sector extraction.
          call_pattern = r'extract_lap_sectors\(\s*&gfx,\s*lap\.gfx_start,\s*lap\.gfx_end\s*\)'
          new_text, call_count = re.subn(
              call_pattern,
              'extract_lap_sectors(&gfx, lap.gfx_start, lap.gfx_end, lap.time_sec)',
              new_text,
              count=1,
          )
          if call_count != 1:
              raise SystemExit('Could not locate extract_lap_sectors() call site')

          path.write_text(new_text, encoding='utf-8', newline='\n')

      - name: Validate Rust source
        run: cargo check --bin acr_session_report

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/acr_session_report.rs .github/workflows/fix-sector.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix S3 from completed lap time [sector-fix]"
          git push origin main
