name: fix-sector

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[telemetry-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch reporter
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/bin/acr_session_report.rs')
          text = path.read_text(encoding='utf-8')

          if 'Telemetry lap alignment:' in text:
              print('Per-lap telemetry alignment already present; nothing to patch.')
              raise SystemExit(0)

          # 1) Remove the old global distance-based stream alignment and replace
          # it with a time-based lap alignment. Graphics supplies the authoritative
          # lap boundaries; Physics is selected by the corresponding lap time window.
          old = '''    // Physics and Graphics do not share packet-id/time axes.  Align them by
    // the actual recorded distance, using the measured physics sample rate.
    // This avoids the long-session drift caused by assuming exactly 333/60 Hz.
    let physics_eff_hz = effective_physics_hz(&physics_records, &physics, physics_hz);
    let (gfx_to_phy_a, gfx_to_phy_b) = fit_gfx_to_physics_by_distance(
        &gfx, &physics_records, physics_eff_hz,
    );
    eprintln!(
        "Telemetry distance alignment: physics_eff_hz={:.3} Hz, gfx->physics index = {:.6} * gfx + {:.1}",
        physics_eff_hz, gfx_to_phy_a, gfx_to_phy_b
    );
'''
          new = '''    // Graphics.completed_lap and its lap time are authoritative for lap
    // boundaries.  The two streams do not share packet IDs, and Graphics
    // distance can reset in pit lane, so NEVER fit Physics to Graphics by
    // global distance.  Instead establish one stream-time offset and then
    // map each lap by its own elapsed time.
    let first_lap_end = boundaries[0].1;
    let stream_offset = estimate_stream_offset(
        &physics_records, &gfx, gfx_hz, first_lap_end,
    );
    eprintln!(
        "Telemetry lap alignment: gfx/physics stream offset={:+.3}s",
        stream_offset
    );
'''
          if old not in text:
              raise SystemExit('old global alignment block not found')
          text = text.replace(old, new, 1)

          # 2) Replace the per-lap Physics window and Graphics mapping.
          old2 = '''        let p_start = gfx_to_physics_index(lap.gfx_start, gfx_to_phy_a, gfx_to_phy_b, physics_records.len());
        let p_end = gfx_to_physics_index(lap.gfx_end, gfx_to_phy_a, gfx_to_phy_b, physics_records.len());
        let physics_start_time = physics_records[p_start].capture_time_sec;
        let (p0, p1) = if p_start <= p_end { (p_start, p_end) } else { (p_end, p_start) };
        let selected: Vec<_> = physics_records[p0..=p1].iter().collect();
'''
          new2 = '''        let gfx_start_time = lap.gfx_start as f64 / gfx_hz.max(1) as f64;
        let physics_start_time = gfx_start_time - stream_offset;
        let physics_end_time = physics_start_time + lap.time_sec.max(0.0);
        let p_start = nearest_index_by_time(&physics_records, physics_start_time);
        let p_end = nearest_index_by_time(&physics_records, physics_end_time);
        let (p0, p1) = if p_start <= p_end { (p_start, p_end) } else { (p_end, p_start) };
        let selected: Vec<_> = physics_records[p0..=p1].iter().collect();
'''
          if old2 not in text:
              raise SystemExit('old per-lap Physics window not found')
          text = text.replace(old2, new2, 1)

          # 3) Replace the telemetry sample Graphics lookup. X remains the
          # Graphics lap distance; Y comes from the Physics sample at the same
          # relative lap time.
          old3 = '''            let pi = nearest_index_by_time(&physics_records, r.capture_time_sec);
            let gi = physics_to_gfx_index(pi, gfx_to_phy_a, gfx_to_phy_b, gfx.len())
                .clamp(lap.gfx_start, lap.gfx_end);
            let g = &gfx[gi];
'''
          new3 = '''            let lap_t = (r.capture_time_sec - physics_start_time).clamp(0.0, lap.time_sec.max(0.0));
            let gi = gfx_index_for_lap_time(
                lap.gfx_start, lap.gfx_end, lap_t, lap.time_sec,
            );
            let g = &gfx[gi];
'''
          if old3 not in text:
              raise SystemExit('old telemetry Graphics lookup not found')
          text = text.replace(old3, new3, 1)

          # 4) Event extraction must use exactly the same per-lap time mapping.
          old4 = '''            &track_name,
            gfx_to_phy_a,
            gfx_to_phy_b,
        );
'''
          new4 = '''            &track_name,
            gfx_hz,
        );
'''
          if old4 not in text:
              raise SystemExit('old event_points arguments not found')
          text = text.replace(old4, new4, 1)

          # 5) Change event_points signature and its Physics->Graphics lookup.
          old5 = '''    track_name: &str,
    gfx_to_phy_a: f64,
    gfx_to_phy_b: f64,
) -> (Vec<serde_json::Value>, Vec<serde_json::Value>) {
'''
          new5 = '''    track_name: &str,
    gfx_hz: u32,
) -> (Vec<serde_json::Value>, Vec<serde_json::Value>) {
'''
          if old5 not in text:
              raise SystemExit('event_points signature not found')
          text = text.replace(old5, new5, 1)

          old6 = '''        let physics_index = nearest_index_by_time(physics, r.capture_time_sec);
        let gi = physics_to_gfx_index(physics_index, gfx_to_phy_a, gfx_to_phy_b, gfx.len())
            .clamp(gfx_start, gfx_end);
        let g = &gfx[gi];
'''
          new6 = '''        let lap_t = (r.capture_time_sec - lap_start_physics_time)
            .clamp(0.0, lap_time_sec.max(0.0));
        let gi = gfx_index_for_lap_time(gfx_start, gfx_end, lap_t, lap_time_sec);
        let g = &gfx[gi];
'''
          if old6 not in text:
              raise SystemExit('event_points Graphics lookup not found')
          text = text.replace(old6, new6, 1)

          # 6) Replace the obsolete global mapping function with a simple,
          # deterministic per-lap time mapper.
          start = text.find('fn fit_gfx_to_physics_by_distance(')
          if start < 0:
              raise SystemExit('old fit function not found')
          end = text.find('\nfn gfx_to_physics_index(', start)
          if end < 0:
              raise SystemExit('end of old fit function not found')
          replacement = '''fn gfx_index_for_lap_time(
    gfx_start: usize,
    gfx_end: usize,
    lap_time: f64,
    lap_duration: f64,
) -> usize {
    if gfx_end <= gfx_start || !lap_duration.is_finite() || lap_duration <= 0.0 {
        return gfx_start;
    }
    let u = (lap_time / lap_duration).clamp(0.0, 1.0);
    gfx_start + (((gfx_end - gfx_start) as f64 * u).round() as usize)
}
'''
          text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          print('Applied per-lap time alignment patch.')

      - name: Validate reporter
        run: |
          cargo fmt --check -- src/bin/acr_session_report.rs
          cargo check --release --bin acr_session_report
          ! grep -q 'fit_gfx_to_physics_by_distance' src/bin/acr_session_report.rs
          ! grep -q 'Telemetry distance alignment:' src/bin/acr_session_report.rs
          grep -q 'Telemetry lap alignment:' src/bin/acr_session_report.rs

      - name: Commit validated reporter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bin/acr_session_report.rs
          git diff --cached --quiet && exit 0
          git commit -m "[telemetry-fix] Use per-lap telemetry alignment"
          git push
