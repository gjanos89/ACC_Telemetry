<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACC Session Report</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#111;color:#eee;margin:0;padding:24px}
h1{margin:0}.muted{color:#999}.plot{height:360px}
.panel{background:#181818;border:1px solid #333;border-radius:10px;padding:16px;margin:14px 0}
select{background:#222;color:#eee;border:1px solid #555;border-radius:6px;padding:7px 10px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #333;text-align:right}
th:first-child,td:first-child{text-align:left}.cards{display:flex;gap:12px;flex-wrap:wrap}
.card{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:14px 18px;min-width:140px}.card b{display:block;font-size:22px;margin-top:5px}
.lap-best{color:#78d98a;font-weight:800}.new-pr{box-shadow:inset 3px 0 0 #78d98a}.pr-badge{color:#78d98a;font-weight:800;margin-left:7px}
.sector-best{color:#c084fc;font-weight:800}.sector-cell{min-width:82px}.legend{font-size:12px;color:#aaa;margin:8px 0}.legend span{margin-right:16px}.purple-dot{color:#c084fc}.green-dot{color:#78d98a}
.summary{display:flex;gap:10px;flex-wrap:wrap}.metric{background:#202020;border:1px solid #383838;border-radius:7px;padding:9px 12px;min-width:120px}.metric span{display:block;color:#999;font-size:11px}.metric b{font-size:16px}
</style>
</head>
<body>
<h1>ACC Session Report</h1>
<div class="muted" id="meta"></div>
<div class="cards" id="cards"></div>

<div class="panel">
<h2>Lap times &amp; sectors</h2>
<div class="legend"><span class="green-dot">â—Ź</span> Session-best lap <span class="purple-dot">â—Ź</span> Session-best sector <span>PR = new personal record</span></div>
<table>
<thead><tr><th>Lap</th><th>Time</th><th>Î”</th><th>S1</th><th>S2</th><th>S3</th><th>Valid</th></tr></thead>
<tbody id="laps"></tbody>
</table>
</div>

<div class="panel"><h2>Session best sectors</h2><div class="summary" id="sectorSummary"></div></div>
<div class="panel"><h2>Personal record</h2><div class="summary" id="prSummary"></div></div>

<div class="panel">
<h2>Lap comparison</h2>
<select id="a"></select> <select id="b"></select>
<div id="speed" class="plot"></div><div id="gas" class="plot"></div><div id="brake" class="plot"></div><div id="steer" class="plot"></div>
</div>

<script>
const D=__JS_DATA__;
const base={paper_bgcolor:'#111',plot_bgcolor:'#181818',font:{color:'#ddd'},margin:{t:42,r:20,b:48,l:58},hovermode:'x unified'};
const fmt=s=>Number.isFinite(s)&&s>0?`${Math.floor(s/60)}:${(s%60).toFixed(3).padStart(6,'0')}`:'â€”';
const metric=(name,value)=>`<div class="metric"><span>${name}</span><b>${value}</b></div>`;

document.getElementById('meta').textContent=`${D.track_name} Â· ${D.car_name}`;
document.getElementById('cards').innerHTML=
 `<div class="card">Laps<b>${D.laps.length}</b></div>`+
 `<div class="card">Best<b>${D.best_time}</b></div>`+
 `<div class="card">Personal record<b>${D.best_ever?D.best_ever.time:'â€”'}</b></div>`+
 `<div class="card">Physics<b>${D.physics_samples}</b></div>`+
 `<div class="card">Graphics<b>${D.graphics_samples}</b></div>`;

const laps=document.getElementById('laps');
D.laps.forEach((l,i)=>{
 const tr=document.createElement('tr');
 if(l.session_best)tr.classList.add('new-pr');
 const sectors=l.sectors||[];
 const cell=(s)=>s&&s.session_best?`<td class="sector-cell sector-best">${s.time}</td>`:`<td class="sector-cell">${s?s.time:'â€”'}</td>`;
 const pr=(D.new_personal_record&&l.session_best)?'<span class="pr-badge">PR</span>':'';
 tr.innerHTML=`<td>${l.lap}</td><td class="${l.session_best?'lap-best':''}">${l.time}${pr}</td><td>${l.delta>=0?'+':''}${l.delta.toFixed(3)}</td>${cell(sectors[0])}${cell(sectors[1])}${cell(sectors[2])}<td>${l.valid?'YES':'NO'}</td>`;
 laps.appendChild(tr);
});

const ss=document.getElementById('sectorSummary');
(D.session_best_sectors||[]).forEach((s,i)=>{if(s)ss.innerHTML+=metric(`S${i+1}`,s.time)});
if(!ss.innerHTML)ss.innerHTML=metric('Sectors','â€”');
const pr=document.getElementById('prSummary');
pr.innerHTML=metric('Personal record',D.best_ever?D.best_ever.time:'â€”');
if(D.new_personal_record)pr.innerHTML+=metric('Status','NEW PR');
if(D.best_ever)pr.innerHTML+=metric('Source',`${D.best_ever.source_session||'â€”'} Â· Lap ${D.best_ever.lap||'â€”'}`);

const a=document.getElementById('a'),b=document.getElementById('b');
D.laps.forEach((l,i)=>{a.add(new Option(`Lap ${l.lap} â€” ${l.time}`,i));b.add(new Option(`Lap ${l.lap} â€” ${l.time}`,i))});
if(D.best_idx!==undefined){a.value=D.best_idx;b.value=D.best_idx===0?(D.laps.length>1?1:0):0;}
function draw(id,key,title,unit){
 const A=D.laps[+a.value],B=D.laps[+b.value];if(!A||!B)return;
 Plotly.react(id,[
  {x:A.telem.map(x=>x.distance),y:A.telem.map(x=>x[key]),name:`Lap ${A.lap}`,mode:'lines'},
  {x:B.telem.map(x=>x.distance),y:B.telem.map(x=>x[key]),name:`Lap ${B.lap}`,mode:'lines',line:{dash:'dot'}}
 ],{...base,title,xaxis:{title:'Distance (m)'},yaxis:{title:unit}},{responsive:true});
}
function redraw(){draw('speed','speed','Speed','km/h');draw('gas','gas','Throttle','%');draw('brake','brake','Brake','%');draw('steer','steer','Steering','deg')}
a.onchange=redraw;b.onchange=redraw;redraw();
</script>
</body></html>
